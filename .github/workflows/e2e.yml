name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Browser binaries are cached per Playwright version (a version bump is
      # a cache miss and a fresh download). The system packages they need come
      # from apt and can't be cached here, so a cache hit still installs those.
      - name: Read Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium-webkit
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit --with-deps
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
      - run: npm run check
      # Source integrity. The pre-commit hook catches raw NUL bytes earlier, but
      # it needs `npm run hooks:install` per clone and `--no-verify` skips it, so
      # this is the copy that actually binds.
      - run: npm run check:nuls
      - run: npm test
      # Build runs the bundle-size assertion (scripts/assert-bundle-size.mjs),
      # so a chunk regression fails here instead of at deploy time.
      - run: npm run build
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: .playwright-mcp/playwright-report
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: .playwright-mcp/test-results
