name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium webkit --with-deps
      - run: npm run check
      # Source integrity. The pre-commit hook catches raw NUL bytes earlier, but
      # it needs `npm run hooks:install` per clone and `--no-verify` skips it, so
      # this is the copy that actually binds.
      - run: npm run check:nuls
      - run: npm test
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: .playwright-mcp/playwright-report
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: .playwright-mcp/test-results
